services:
  wxread:
    build: .
    image: wxread:local
    container_name: wxread
    restart: unless-stopped
    volumes:
      - ./state:/app/.state
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      READ_NUM: ${READ_NUM:-40}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 1 * * *}
      WXREAD_LOGIN_JSON: ${WXREAD_LOGIN_JSON:-}
      WXREAD_CURL_BASH: ${WXREAD_CURL_BASH:-}
      WXREAD_COOKIE_FILE: /app/.state/cookies.enc
      PUSH_METHOD: ${PUSH_METHOD:-}
      PUSHPLUS_TOKEN: ${PUSHPLUS_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WXPUSHER_SPT: ${WXPUSHER_SPT:-}
      SERVERCHAN_SPT: ${SERVERCHAN_SPT:-}
