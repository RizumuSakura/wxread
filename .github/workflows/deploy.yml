name: wxread
run-name: ${{ inputs.check_auth && '仅验证登录续期' || '固定书籍阅读' }}

on:
  schedule:
    # 16:47 Asia/Shanghai。GitHub 的 schedule 队列实测会延迟 4–7.5 小时，
    # cron 只负责"早到"，真正的启动时刻由 start_window.py 钉到 01:00:00。
    # 延迟后的到达时刻：20:44–00:17（CST），都在 01:00 之前。
    - cron: '47 8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 忽略 01:00 的时间限制，立即运行
        type: boolean
        default: false
      check_auth:
        description: 仅验证 Cookie 续期（不阅读、不推送）
        type: boolean
        default: false
      book_url:
        description: 本次书籍链接或数字 bookId；留空则用 WXREAD_BOOK_URL，再留空默认《被讨厌的勇气》25615385
        type: string
        default: ''
      read_num:
        description: 本次真实等待周期数（每段 30 秒，1–400）；留空用 READ_NUM，默认 240（约 2 小时）
        type: string
        default: ''
      skip_push:
        description: 仅本次不发送通知（测试时可勾选）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 同一账号的扫码与阅读必须互斥，与触发分支无关。
  group: wxread-session-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # 只做长等待：队列早到几小时由它吸收，交棒时刻 00:30（CST）。
  # 单独成 job 是为了不占用阅读 job 的 6 小时上限。
  window:
    name: Wait for the night window
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      window_ok: ${{ steps.gate.outputs.window_ok }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Sleep until the handoff point
        id: gate
        # 最长睡 240 分钟（start_window.MAX_WAIT_SECONDS），再留出对时误差。
        timeout-minutes: 320
        env:
          WXREAD_FORCE_WINDOW: ${{ inputs.force }}
          WXREAD_WAKE_LEAD_SECONDS: '1800'
        run: python start_window.py

  deploy:
    needs: window
    if: ${{ needs.window.outputs.window_ok == 'true' }}
    runs-on: ubuntu-latest
    # 01:00:00 起跑 121 分钟 + 安装依赖与网络重试余量；上限 400 段约 205 分钟。
    timeout-minutes: 260
    environment: AutoRead
    env:
      PYTHONUNBUFFERED: '1'
      WXREAD_QR_PASSWORD: ${{ secrets.WXREAD_QR_PASSWORD }}
      WXREAD_LOGIN_JSON: ${{ secrets.WXREAD_LOGIN_JSON }}
      WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
      WXREAD_LOGIN_FILE: .state/login.enc
      WXREAD_COOKIE_FILE: .state/cookies.enc

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare encrypted session cache
        id: cache
        run: python actions_login.py cache-key

      - name: Restore latest login and Cookie state
        uses: actions/cache/restore@v6
        with:
          path: |
            .state/login.enc
            .state/cookies.enc
            .state/device.json
          key: ${{ steps.cache.outputs.cache_key }}
          restore-keys: ${{ steps.cache.outputs.cache_prefix }}

      - name: Migrate the v2 encrypted login cache once
        if: ${{ steps.cache.outputs.mode == 'cloud' && steps.cache.outputs.legacy_cache_prefix != '' && hashFiles('.state/login.enc') == '' && hashFiles('.state/cookies.enc') == '' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            .state/login.enc
            .state/cookies.enc
            .state/device.json
          key: ${{ steps.cache.outputs.legacy_cache_prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache.outputs.legacy_cache_prefix }}

      # 最后一步对时：睡到 01:00:00 整，再在同一秒开始阅读。
      - name: Wait until exactly 01:00 CST
        id: gate
        timeout-minutes: 40
        env:
          WXREAD_FORCE_WINDOW: ${{ inputs.force }}
        run: python start_window.py

      - name: Run reading task or renewal-only check
        if: ${{ steps.gate.outputs.window_ok == 'true' }}
        timeout-minutes: 215
        env:
          WXREAD_BOOK_URL: ${{ inputs.book_url || vars.WXREAD_BOOK_URL }}
          READ_NUM: ${{ inputs.read_num || vars.READ_NUM }}
          WXREAD_CHECK_AUTH: ${{ inputs.check_auth }}
          WXREAD_SKIP_PUSH: ${{ inputs.skip_push }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
        run: |
          if [ "$WXREAD_SKIP_PUSH" = "true" ]; then
            export PUSH_METHOD=""
          fi
          if [ "$WXREAD_CHECK_AUTH" = "true" ]; then
            exec python main.py --check-auth
          fi
          exec python main.py

      - name: Save updated encrypted session state
        if: ${{ always() && steps.cache.outcome == 'success' && hashFiles('.state/cookies.enc') != '' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .state/login.enc
            .state/cookies.enc
            .state/device.json
          key: ${{ steps.cache.outputs.cache_key }}

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
