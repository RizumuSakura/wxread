name: wxread
run-name: ${{ inputs.check_auth && '仅验证登录续期' || '固定书籍阅读' }}

on:
  schedule:
    # 21:07 Asia/Shanghai. GitHub 的 schedule 队列实测延迟 4–7.5 小时，
    # 声明在这里是为了让任务落在凌晨 01:00–04:30（CST）而不是早上 6 点后。
    - cron: '7 13 * * *'
  workflow_dispatch:
    inputs:
      check_auth:
        description: 仅验证 Cookie 续期（不阅读、不推送）
        type: boolean
        default: false
      book_url:
        description: 本次书籍链接或数字 bookId；留空则用 WXREAD_BOOK_URL，再留空默认《被讨厌的勇气》25615385
        type: string
        default: ''
      read_num:
        description: 本次真实等待周期数（每段 30 秒，1–400）；留空用 READ_NUM，默认 240（约 2 小时）
        type: string
        default: ''
      skip_push:
        description: 仅本次不发送通知（测试时可勾选）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 同一账号的扫码与阅读必须互斥，与触发分支无关。
  group: wxread-session-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: AutoRead
    env:
      PYTHONUNBUFFERED: '1'
      WXREAD_QR_PASSWORD: ${{ secrets.WXREAD_QR_PASSWORD }}
      WXREAD_LOGIN_JSON: ${{ secrets.WXREAD_LOGIN_JSON }}
      WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
      WXREAD_LOGIN_FILE: .state/login.enc
      WXREAD_COOKIE_FILE: .state/cookies.enc

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare encrypted session cache
        id: cache
        run: python actions_login.py cache-key

      - name: Restore latest login and Cookie state
        uses: actions/cache/restore@v6
        with:
          path: |
            .state/login.enc
            .state/cookies.enc
            .state/device.json
          key: ${{ steps.cache.outputs.cache_key }}
          restore-keys: ${{ steps.cache.outputs.cache_prefix }}

      - name: Migrate the v2 encrypted login cache once
        if: ${{ steps.cache.outputs.mode == 'cloud' && steps.cache.outputs.legacy_cache_prefix != '' && hashFiles('.state/login.enc') == '' && hashFiles('.state/cookies.enc') == '' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            .state/login.enc
            .state/cookies.enc
            .state/device.json
          key: ${{ steps.cache.outputs.legacy_cache_prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache.outputs.legacy_cache_prefix }}

      - name: Run reading task or renewal-only check
        timeout-minutes: 330
        env:
          WXREAD_BOOK_URL: ${{ inputs.book_url || vars.WXREAD_BOOK_URL }}
          READ_NUM: ${{ inputs.read_num || vars.READ_NUM }}
          WXREAD_CHECK_AUTH: ${{ inputs.check_auth }}
          WXREAD_SKIP_PUSH: ${{ inputs.skip_push }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
        run: |
          if [ "$WXREAD_SKIP_PUSH" = "true" ]; then
            export PUSH_METHOD=""
          fi
          if [ "$WXREAD_CHECK_AUTH" = "true" ]; then
            exec python main.py --check-auth
          fi
          exec python main.py

      - name: Save updated encrypted session state
        if: ${{ always() && steps.cache.outcome == 'success' && hashFiles('.state/cookies.enc') != '' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .state/login.enc
            .state/cookies.enc
            .state/device.json
          key: ${{ steps.cache.outputs.cache_key }}

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
