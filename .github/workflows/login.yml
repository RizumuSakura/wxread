name: 扫码登录
run-name: 微信读书扫码登录

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: wxread-session-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  login:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: AutoRead
    env:
      PYTHONUNBUFFERED: '1'
      WXREAD_QR_PASSWORD: ${{ secrets.WXREAD_QR_PASSWORD }}
      WXREAD_LOGIN_JSON: ${{ secrets.WXREAD_LOGIN_JSON }}
      WXREAD_LOGIN_FILE: .state/login.enc
      WXREAD_COOKIE_FILE: .state/cookies.enc
      WXREAD_ACCOUNT_VID: ${{ vars.WXREAD_ACCOUNT_VID }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare cloud cache key
        id: cache
        run: python actions_login.py cache-key --require-cloud

      - name: Restore cloud login state
        uses: actions/cache/restore@v6
        with:
          path: |
            .state/login.enc
            .state/cookies.enc
            .state/device.json
          key: ${{ steps.cache.outputs.cache_key }}
          restore-keys: ${{ steps.cache.outputs.cache_prefix }}

      - name: Generate encrypted QR viewer
        id: prepare
        run: python actions_login.py prepare

      - name: Publish encrypted QR viewer
        id: qr
        uses: actions/upload-artifact@v7
        with:
          name: wxread-login-qr
          path: .state/qr-public/login.html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Link QR download in run summary
        env:
          QR_ARTIFACT_URL: ${{ steps.qr.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('\n[下载二维码附件](' + os.environ['QR_ARTIFACT_URL'] + ')\n')
          PY

      - name: Wait for QR login
        id: wait
        run: python actions_login.py wait

      - name: Save cloud login state
        if: ${{ always() && steps.wait.outputs.authenticated == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .state/login.enc
            .state/cookies.enc
            .state/device.json
          key: ${{ steps.cache.outputs.cache_key }}
